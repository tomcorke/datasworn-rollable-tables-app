<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Datasworn Oracle Tables</title>
    <script>
      (() => {
        let theme;
        try {
          const saved = localStorage.getItem("datasworn.theme");
          if (saved === "light" || saved === "dark") theme = saved;
        } catch {}
        if (!theme) {
          try {
            theme = matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          } catch {
            theme = "light";
          }
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 4 93 35 77 87H23L7 35Z' fill='%23174c3e' stroke='%23d4e5d9' stroke-width='5'/%3E%3Cpath d='M50 4v83M7 35h86M23 87 50 4l27 83M7 35l70 52M93 35 23 87' fill='none' stroke='%23d4e5d9' stroke-width='3'/%3E%3Ctext x='50' y='59' text-anchor='middle' fill='%23fff' font-family='sans-serif' font-size='28' font-weight='bold'%3E20%3C/text%3E%3C/svg%3E"
    />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
